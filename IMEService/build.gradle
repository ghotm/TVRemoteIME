plugins {
    id 'com.android.application'
}

// 签名配置：优先读取环境变量（CI 中由 GitHub Secrets 注入），本地开发可回退到仓库根 keystore.properties（该文件含凭据，勿提交）
// 保证 CI 产物签名一致、可安装、可升级；未提供凭据时退回未签名构建
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def ksStoreFile = System.getenv('KEYSTORE_FILE') ?: keystoreProperties['storeFile']
def ksStorePassword = System.getenv('KEYSTORE_PASSWORD') ?: keystoreProperties['storePassword']
def ksKeyAlias = System.getenv('KEY_ALIAS') ?: keystoreProperties['keyAlias']
def ksKeyPassword = System.getenv('KEY_PASSWORD') ?: keystoreProperties['keyPassword']
def hasSigningConfig = ksStoreFile != null && ksStorePassword != null && ksKeyAlias != null && ksKeyPassword != null

android {
    namespace 'com.android.tvremoteime'
    compileSdk 36
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId 'com.android.tvremoteime'
        minSdk 21
        targetSdk 36
        versionCode 12
        versionName "2.0.0"
    }

    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile rootProject.file(ksStoreFile)
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // debug 也用固定签名，保证任意产物可安装且升级签名一致
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../proguard-project.txt'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.13.1'
    implementation project(path: ':AdbLib')
    implementation project(path: ':DroidDLNA')
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
}
