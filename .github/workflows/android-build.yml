name: Android CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - 'released/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - 'released/**'
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

# 同一分支的新提交会取消正在运行的旧构建
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 Debug 与 Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 已移除独立的 tools 包，必须显式覆盖默认值（tools platform-tools），否则 sdkmanager tools 会报 Failed to find package 'tools'
          packages: 'platform-tools'

      - name: 安装 SDK 平台与构建工具
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 修复 gradlew 执行权限
        run: chmod +x gradlew

      - name: 还原签名 keystore（GitHub Secrets）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 未配置 Secret 时跳过（产物不签名，仅用于调试）
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/tvremoteime-release.p12
            echo "p12 文件大小: $(stat -c%s keystore/tvremoteime-release.p12) 字节"
            echo "KEYSTORE_FILE=keystore/tvremoteime-release.p12" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 KEYSTORE_BASE64，本次产物将不签名"
          fi

      - name: 编译 Debug 与 Release
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IMEService-debug-apk
          path: IMEService/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: IMEService-release-apk
          path: IMEService/build/outputs/apk/release/*.apk
          if-no-files-found: error
